<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>French Study Buddy — Studio Interactif TCF & DELF</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/canvas-confetti.min.js"></script>
<style>
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  @keyframes pulseMic { 0%{box-shadow:0 0 0 0 rgba(244,63,94,0.4);} 70%{box-shadow:0 0 0 16px rgba(244,63,94,0);} 100%{box-shadow:0 0 0 0 rgba(244,63,94,0);} }
  .recording-active { animation: pulseMic 1.5s infinite; background: #F43F5E !important; color: #fff !important; }

  @keyframes speakRing { 0%{box-shadow:0 0 0 0 rgba(79,70,229,.45);} 70%{box-shadow:0 0 0 14px rgba(79,70,229,0);} 100%{box-shadow:0 0 0 0 rgba(79,70,229,0);} }
  .avatar { border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; border:3px solid transparent; }
  .avatar.speaking { animation:speakRing 1.4s infinite; transform:scale(1.06); }
</style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

  <!-- Top Header with Plume -->
  <header class="bg-indigo-700 text-white px-6 py-3 flex items-center justify-between shadow-md z-20">
    <div class="flex items-center gap-3">
      <div id="plumeAvatarWrap" class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center border border-white/20">
        <svg id="plumeFaceSvg" viewBox="0 0 72 72" width="32" height="32">
          <circle cx="36" cy="36" r="32" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5"/>
          <circle cx="26" cy="30" r="3.2" fill="#4338CA"/>
          <circle cx="46" cy="30" r="3.2" fill="#4338CA"/>
          <path id="plumeMouth" d="M26 46 Q36 46 46 46" stroke="#4338CA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight">French Study Buddy &amp; Plume</h1>
        <p class="text-indigo-200 text-xs" id="tutorStateLabel">Plume — Prête à t'aider</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span id="connStatus" class="hidden sm:inline-flex items-center gap-1.5 text-xs bg-white/10 rounded-full px-3 py-1">
        <span id="connDot" class="w-2 h-2 rounded-full bg-slate-400"></span>
        <span id="connLabel">Non configuré</span>
      </span>
      <button id="settingsBtn" class="bg-white/10 hover:bg-white/20 transition rounded-lg px-3 py-2 text-sm font-semibold">⚙️ Paramètres</button>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden">
    <!-- Left Syllabus Sidebar -->
    <aside class="hidden md:flex md:flex-col w-80 bg-white border-r border-slate-200 overflow-y-auto shrink-0 shadow-sm">
      <div class="p-4 border-b border-slate-100 bg-indigo-50/70 sticky top-0 z-10 space-y-3">
        <div>
          <h2 class="font-bold text-xs text-indigo-900 uppercase tracking-wide">Programme Officiel TCF</h2>
          <p class="text-[11px] text-slate-500 mt-0.5">Choisis un module</p>
        </div>
        <input id="topicSearchInput" type="text" placeholder="Filtrer les thèmes..." class="w-full px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div id="topicsList" class="p-3 space-y-3"></div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 bg-slate-50 overflow-y-auto p-6">
      <div class="max-w-4xl mx-auto w-full space-y-4">
        
        <!-- Navigation Panes -->
        <div class="grid grid-cols-3 sm:grid-cols-6 gap-1.5">
          <button id="paneBtnModules" class="pane-btn text-[11px] font-bold py-2.5 px-1 rounded-xl border-2 border-indigo-600 bg-indigo-600 text-white transition">📚 Modules</button>
          <button id="paneBtnVocab" class="pane-btn text-[11px] font-bold py-2.5 px-1 rounded-xl border-2 border-slate-300 bg-white text-slate-600 transition">🔤 Vocab</button>
          <button id="paneBtnReading" class="pane-btn text-[11px] font-bold py-2.5 px-1 rounded-xl border-2 border-slate-300 bg-white text-slate-600 transition">📖 Lecture</button>
          <button id="paneBtnListening" class="pane-btn text-[11px] font-bold py-2.5 px-1 rounded-xl border-2 border-slate-300 bg-white text-slate-600 transition">👂 Écoute</button>
          <button id="paneBtnWriting" class="pane-btn text-[11px] font-bold py-2.5 px-1 rounded-xl border-2 border-slate-300 bg-white text-slate-600 transition">✍️ Écrit</button>
          <button id="paneBtnGame" class="pane-btn text-[11px] font-bold py-2.5 px-1 rounded-xl border-2 border-slate-300 bg-white text-slate-600 transition">🧩 Jeu</button>
        </div>

        <!-- Modules Chat View -->
        <div id="paneModules" class="space-y-3">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <span id="topicPill" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">Choisis un thème à gauche</span>
            <div class="flex gap-1.5">
              <button id="speedToggleBtn" class="text-[11px] font-bold px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600">⚡ 1.0x</button>
              <button id="replayBtn" class="text-[11px] font-bold px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600">🔊 Réécouter</button>
              <button id="exportBtn" class="text-[11px] font-bold px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600">📥 Exporter</button>
            </div>
          </div>
          <div id="lessonStream" class="bg-white border border-slate-200 rounded-3xl p-4 space-y-3 min-h-[200px]">
            <p class="text-xs text-slate-400">👋 Choisis un thème dans le menu pour démarrer une leçon avec Plume.</p>
          </div>
          <div class="flex items-end gap-2">
            <input id="lessonInput" type="text" placeholder="Réponds à Plume..." class="flex-1 border border-slate-300 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
            <button id="lessonSendBtn" class="shrink-0 bg-indigo-600 text-white rounded-full w-11 h-11 flex items-center justify-center text-lg transition">➤</button>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-black/40 z-40 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-lg">⚙️ Configuration</h2>
        <button id="closeSettings" class="text-slate-400 text-xl">&times;</button>
      </div>
      <label class="block text-xs font-semibold text-slate-500 mb-1">API Base URL</label>
      <input id="cfgBaseUrl" type="text" placeholder="https://api.groq.com/openai/v1/chat/completions" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">API Key</label>
      <input id="cfgApiKey" type="password" placeholder="gsk_..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-3">
      <label class="block text-xs font-semibold text-slate-500 mb-1">Model Name</label>
      <input id="cfgModel" type="text" placeholder="llama-3.3-70b-versatile" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-4">
      <button id="saveSettingsBtn" class="w-full bg-indigo-600 text-white rounded-lg py-2.5 text-sm font-semibold">Enregistrer</button>
    </div>
  </div>

<script>
const STUDY_MODULES = [
  { title: '🟢 DELF A1 — Vocabulaire', topics: ["L'alphabet", "Les nombres", "Les nationalités", "Les professions", "La famille proche", "La météo"] }
];

function renderTopics(){
  document.getElementById('topicsList').innerHTML = STUDY_MODULES.map(m=>`
    <div>
      <h3 class="text-xs font-bold text-indigo-900 mb-1">${m.title}</h3>
      <div class="space-y-1">
        ${m.topics.map(t=>`<button class="topic-btn w-full text-left text-xs px-3 py-2 rounded-lg border border-slate-200 hover:bg-indigo-50 font-medium text-slate-700" data-topic="${t}">${t}</button>`).join('')}
      </div>
    </div>
  `).join('');
  document.querySelectorAll('.topic-btn').forEach(btn=>{
    btn.onclick = ()=>{
      if(btn.dataset.topic === "Les nationalités"){
        window.location.href = "modules/nationalities.html";
      } else {
        startTopicLesson(btn.dataset.topic);
      }
    };
  });
}
renderTopics();

function getConfig(){ return { baseUrl: localStorage.getItem('fsb_base_url'), apiKey: localStorage.getItem('fsb_api_key'), model: localStorage.getItem('fsb_model') }; }
function saveConfig(cfg){
  localStorage.setItem('fsb_base_url', cfg.baseUrl);
  localStorage.setItem('fsb_api_key', cfg.apiKey);
  localStorage.setItem('fsb_model', cfg.model);
  updateConnStatus();
}
function updateConnStatus(){
  const cfg = getConfig();
  document.getElementById('connDot').className = 'w-2 h-2 rounded-full ' + (cfg.baseUrl ? 'bg-emerald-400' : 'bg-slate-400');
  document.getElementById('connLabel').textContent = cfg.model || 'Non configuré';
}

document.getElementById('settingsBtn').onclick = ()=>{
  const cfg = getConfig();
  document.getElementById('cfgBaseUrl').value = cfg.baseUrl || '';
  document.getElementById('cfgApiKey').value = cfg.apiKey || '';
  document.getElementById('cfgModel').value = cfg.model || '';
  document.getElementById('settingsModal').classList.remove('hidden');
};
document.getElementById('closeSettings').onclick = ()=> document.getElementById('settingsModal').classList.add('hidden');
document.getElementById('saveSettingsBtn').onclick = ()=>{
  saveConfig({
    baseUrl: document.getElementById('cfgBaseUrl').value.trim(),
    apiKey: document.getElementById('cfgApiKey').value.trim(),
    model: document.getElementById('cfgModel').value.trim()
  });
  document.getElementById('settingsModal').classList.add('hidden');
};

let speechRates = [1.0, 1.5, 2.0];
let rateIdx = 0;
let currentSpeechRate = 1.0;
let lastSpokenText = '';

document.getElementById('speedToggleBtn').onclick = ()=>{
  rateIdx = (rateIdx + 1) % speechRates.length;
  currentSpeechRate = speechRates[rateIdx];
  document.getElementById('speedToggleBtn').textContent = `⚡ ${currentSpeechRate.toFixed(1)}x`;
};
document.getElementById('replayBtn').onclick = ()=> { if(lastSpokenText) speakPlume(lastSpokenText, true); };
document.getElementById('exportBtn').onclick = ()=>{
  let content = "--- Journal de conversation — Plume ---\n\n" + lessonHistory.map(m=>`${m.role === 'user' ? 'Étudiant' : 'Plume'} : ${m.content}`).join('\n');
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'plume-session.txt'; a.click();
};

function speakPlume(text, positive){
  return new Promise(resolve=>{
    if(!text || !window.speechSynthesis){ resolve(); return; }
    lastSpokenText = text;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = currentSpeechRate;
    u.onstart = ()=> document.getElementById('plumeAvatarWrap').classList.add('speaking');
    u.onend = ()=> { document.getElementById('plumeAvatarWrap').classList.remove('speaking'); resolve(); };
    u.onerror = ()=> { document.getElementById('plumeAvatarWrap').classList.remove('speaking'); resolve(); };
    window.speechSynthesis.speak(u);
  });
}

let lessonHistory = [];
async function startTopicLesson(topic){
  document.getElementById('topicPill').textContent = topic;
  lessonHistory = [];
  const stream = document.getElementById('lessonStream');
  stream.innerHTML = `<p class="text-xs text-slate-400 font-semibold">💬 Plume prépare la leçon...</p>`;
  try{
    const cfg = getConfig();
    if(!cfg.baseUrl) throw new Error("Configure l'API dans les Paramètres.");
    const res = await fetch(cfg.baseUrl, {
      method:'POST',
      headers: { 'Content-Type': 'application/json', ...(cfg.apiKey ? {'Authorization': 'Bearer '+cfg.apiKey} : {}) },
      body: JSON.stringify({ model: cfg.model || 'llama-3.3-70b-versatile', messages: [{role:'system', content:"Tu es Plume, tutrice de français. Réponds en trois lignes:\nPLUME_FR: ...\nPLUME_EN: ...\nSUGGESTIONS: a | b"}, {role:'user', content:`Thème: ${topic}`}], max_tokens:250 })
    });
    const data = await res.json();
    const raw = data?.choices?.[0]?.message?.content?.trim() || '';
    lessonHistory.push({role:'assistant', content:raw});
    stream.innerHTML = `<div class="bg-white border border-slate-200 rounded-2xl p-3 text-sm">${raw}</div>`;
    await speakPlume(raw, true);
  }catch(err){
    stream.innerHTML = `<div class="text-xs text-red-600">⚠️ ${err.message}</div>`;
  }
}

async function sendLessonMessage(){
  const input = document.getElementById('lessonInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  const stream = document.getElementById('lessonStream');
  stream.insertAdjacentHTML('beforeend', `<div class="flex justify-end"><div class="bg-indigo-600 text-white rounded-2xl px-3 py-2 text-sm">${text}</div></div>`);
  stream.scrollTop = stream.scrollHeight;
  try{
    lessonHistory.push({role:'user', content:text});
    const cfg = getConfig();
    const res = await fetch(cfg.baseUrl, {
      method:'POST',
      headers: { 'Content-Type': 'application/json', ...(cfg.apiKey ? {'Authorization': 'Bearer '+cfg.apiKey} : {}) },
      body: JSON.stringify({ model: cfg.model || 'llama-3.3-70b-versatile', messages: [{role:'system', content:"Tu es Plume, tutrice de français."}, ...lessonHistory.slice(-8)], max_tokens:250 })
    });
    const data = await res.json();
    const raw = data?.choices?.[0]?.message?.content?.trim() || '';
    lessonHistory.push({role:'assistant', content:raw});
    stream.insertAdjacentHTML('beforeend', `<div class="bg-white border border-slate-200 rounded-2xl p-3 text-sm mt-2">${raw}</div>`);
    stream.scrollTop = stream.scrollHeight;
    await speakPlume(raw, true);
  }catch(err){}
}
document.getElementById('lessonSendBtn').onclick = sendLessonMessage;
document.getElementById('lessonInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendLessonMessage(); });

updateConnStatus();
if(!getConfig().baseUrl){ setTimeout(()=>document.getElementById('settingsBtn').click(), 400); }
</script>
</body>
</html>
