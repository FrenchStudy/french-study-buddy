<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>French Study Buddy — Studio Interactif TCF & DELF</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  @keyframes pulseMic { 0%{box-shadow:0 0 0 0 rgba(244,63,94,0.4);} 70%{box-shadow:0 0 0 16px rgba(244,63,94,0);} 100%{box-shadow:0 0 0 0 rgba(244,63,94,0);} }
  .recording-active { animation: pulseMic 1.5s infinite; background: #F43F5E !important; color: #fff !important; }
  @keyframes speakRing { 0%{box-shadow:0 0 0 0 rgba(79,70,229,.45);} 70%{box-shadow:0 0 0 14px rgba(79,70,229,0);} 100%{box-shadow:0 0 0 0 rgba(79,70,229,0);} }
  .avatar { border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; border:3px solid transparent; }
  .avatar.speaking { animation:speakRing 1.4s infinite; transform:scale(1.06); }
</style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

  <!-- Top Blue Header with Plume integrated -->
  <header class="bg-indigo-700 text-white px-6 py-3 flex items-center justify-between shadow-md z-20">
    <div class="flex items-center gap-3">
      <div class="relative w-11 h-11 bg-white/10 rounded-full flex items-center justify-center border border-white/20">
        <svg id="plumeFaceSvg" viewBox="0 0 72 72" width="36" height="36">
          <circle cx="36" cy="36" r="32" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5"/>
          <circle cx="26" cy="30" r="3.2" fill="#4338CA"/>
          <circle cx="46" cy="30" r="3.2" fill="#4338CA"/>
          <path id="plumeMouth" d="M26 46 Q36 46 46 46" stroke="#4338CA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight">French Study Buddy &amp; Plume</h1>
        <p class="text-indigo-200 text-xs" id="tutorStateLabel">Plume — Prête à t'aider</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span id="connStatus" class="hidden sm:inline-flex items-center gap-1.5 text-xs bg-white/10 rounded-full px-3 py-1">
        <span id="connDot" class="w-2 h-2 rounded-full bg-slate-400"></span>
        <span id="connLabel">Non configuré</span>
      </span>
      <button id="settingsBtn" class="bg-white/10 hover:bg-white/20 transition rounded-lg px-3 py-2 text-sm font-semibold">⚙️ Paramètres</button>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden">
    <!-- Left Syllabus Sidebar -->
    <aside class="hidden md:flex md:flex-col w-80 bg-white border-r border-slate-200 overflow-y-auto shrink-0 shadow-sm">
      <div class="p-4 border-b border-slate-100 bg-indigo-50/70 sticky top-0 z-10 space-y-3">
        <div>
          <h2 class="font-bold text-xs text-indigo-900 uppercase tracking-wide">Programme Officiel TCF</h2>
          <p class="text-[11px] text-slate-500 mt-0.5">Choisis un module</p>
        </div>
        <input id="topicSearchInput" type="text" placeholder="Filtrer les thèmes..." class="w-full px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div id="topicsList" class="p-3 space-y-3"></div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 bg-slate-50 overflow-y-auto p-6">
      <div class="max-w-4xl mx-auto w-full space-y-4">
        
        <!-- Navigation Panes -->
        <div class="grid grid-cols-3 sm:grid-cols-6 gap-1.5">
          <button id="paneBtnModules" class="pane-btn text-[11px] font-bold py-2.5 px-1 rounded-xl border-2 border-indigo-600 bg-indigo-600 text-white transition">📚 Modules</button>
          <button id="paneBtnVocab" class="pane-btn text-[11px] font-bold py-2.5 px-1 rounded-xl border-2 border-slate-300 bg-white text-slate-600 transition">🔤 Vocab</button>
          <button id="paneBtnReading" class="pane-btn text-[11px] font-bold py-2.5 px-1 rounded-xl border-2 border-slate-300 bg-white text-slate-600 transition">📖 Lecture</button>
          <button id="paneBtnListening" class="pane-btn text-[11px] font-bold py-2.5 px-1 rounded-xl border-2 border-slate-300 bg-white text-slate-600 transition">👂 Écoute</button>
          <button id="paneBtnWriting" class="pane-btn text-[11px] font-bold py-2.5 px-1 rounded-xl border-2 border-slate-300 bg-white text-slate-600 transition">✍️ Écrit</button>
          <button id="paneBtnGame" class="pane-btn text-[11px] font-bold py-2.5 px-1 rounded-xl border-2 border-slate-300 bg-white text-slate-600 transition">🧩 Jeu</button>
        </div>

        <!-- Modules Chat View -->
        <div id="paneModules" class="space-y-3">
          <div class="flex items-center gap-2">
            <span id="topicPill" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">Choisis un thème à gauche</span>
          </div>
          <div id="lessonStream" class="bg-white border border-slate-200 rounded-3xl p-4 space-y-3 min-h-[200px]">
            <p class="text-xs text-slate-400">👋 Choisis un thème dans le menu pour démarrer une leçon avec Plume.</p>
          </div>
          <div class="flex items-end gap-2">
            <input id="lessonInput" type="text" placeholder="Réponds à Plume..." class="flex-1 border border-slate-300 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
            <button id="lessonSendBtn" class="shrink-0 bg-indigo-600 text-white rounded-full w-11 h-11 flex items-center justify-center text-lg transition">➤</button>
          </div>
        </div>

      </div>
    </main>
  </div>

<script>
const STUDY_MODULES = [
  { title: '🟢 DELF A1 — Vocabulaire', topics: ["L'alphabet", "Les nombres", "Les nationalités", "Les professions", "La famille proche", "La météo"] }
];
function renderTopics(){
  document.getElementById('topicsList').innerHTML = STUDY_MODULES.map(m=>`
    <div>
      <h3 class="text-xs font-bold text-indigo-900 mb-1">${m.title}</h3>
      <div class="space-y-1">
        ${m.topics.map(t=>`<button class="topic-btn w-full text-left text-xs px-3 py-2 rounded-lg border border-slate-200 hover:bg-indigo-50 font-medium text-slate-700" data-topic="${t}">${t}</button>`).join('')}
      </div>
    </div>
  `).join('');
  document.querySelectorAll('.topic-btn').forEach(btn=>{
    btn.onclick = ()=>{
      if(btn.dataset.topic === "Les nationalités"){
        window.location.href = "modules/nationalities.html";
      }
    };
  });
}
renderTopics();
function getConfig(){ return { baseUrl: localStorage.getItem('fsb_base_url'), apiKey: localStorage.getItem('fsb_api_key'), model: localStorage.getItem('fsb_model') }; }
function updateConnStatus(){
  const cfg = getConfig();
  document.getElementById('connDot').className = 'w-2 h-2 rounded-full ' + (cfg.baseUrl ? 'bg-emerald-400' : 'bg-slate-400');
  document.getElementById('connLabel').textContent = cfg.model || 'Non configuré';
}
updateConnStatus();
</script>
</body>
</html>
